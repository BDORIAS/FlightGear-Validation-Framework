[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/flightgear_framework
    --cov-report=html:reports/coverage
    --cov-report=term-missing
    --html=reports/pytest_report.html
    --self-contained-html
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed, multiple components)
    system: System tests (slow, full system)
    flightgear: Tests requiring FlightGear instance
    slow: Tests that take significant time to run
    network: Tests that require network connectivity
